<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
  if (localStorage.getItem("omnishell_theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }
</script>
<title>OmniShell &mdash; Join as a teacher</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --accent: #4fc3f7;
  }
  :root[data-theme="light"] {
    --bg: #f4f6f9;
    --panel: #ffffff;
    --border: #d7dce3;
    --text: #1b1f24;
    --muted: #5b6470;
    --accent: #0284c7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .join-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 32px;
    margin: 24px;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.3rem;
    text-align: center;
  }
  .subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
  .invited-email {
    text-align: center;
    font-weight: 600;
    color: var(--accent);
    margin: -12px 0 24px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .error {
    color: #ff6b6b;
    font-size: 0.85rem;
    margin: -8px 0 16px;
    min-height: 1em;
  }
  .login-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    color: var(--muted);
    font-size: 0.85rem;
    text-decoration: none;
  }
  .login-link:hover {
    color: var(--accent);
  }
  .theme-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: auto;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.9rem;
    cursor: pointer;
    line-height: 1.4;
  }
  .theme-toggle:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  [hidden] {
    display: none !important;
  }
</style>
</head>
<body>

<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"></button>

<div class="join-card" id="loading-state">
  <h1>Join as a teacher</h1>
  <p class="subtitle">Checking your invite&hellip;</p>
</div>

<div class="join-card" id="invalid-state" hidden>
  <h1>Invite not found</h1>
  <p class="subtitle" id="invalid-message">This invite link is invalid or has expired. Ask your headteacher to send you a new one.</p>
  <a class="login-link" href="/login.html">Back to sign in</a>
</div>

<form class="join-card" id="accept-form" hidden>
  <h1>Join as a teacher</h1>
  <p class="invited-email" id="invited-email"></p>

  <label for="display-name">Your name</label>
  <input id="display-name" name="displayName" type="text" autocomplete="name" required>

  <p class="error" id="accept-error"></p>

  <button type="submit" id="accept-submit-btn">Create my account</button>
</form>

<script>
  const themeToggleBtn = document.getElementById("theme-toggle");

  function updateThemeToggleLabel() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    themeToggleBtn.textContent = isLight ? "🌙" : "☀️";
    themeToggleBtn.setAttribute("aria-label", isLight ? "Switch to dark theme" : "Switch to light theme");
  }

  themeToggleBtn.addEventListener("click", () => {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    if (isLight) {
      document.documentElement.removeAttribute("data-theme");
      localStorage.setItem("omnishell_theme", "dark");
    } else {
      document.documentElement.setAttribute("data-theme", "light");
      localStorage.setItem("omnishell_theme", "light");
    }
    updateThemeToggleLabel();
  });

  updateThemeToggleLabel();

  const loadingState = document.getElementById("loading-state");
  const invalidState = document.getElementById("invalid-state");
  const invalidMessage = document.getElementById("invalid-message");
  const acceptForm = document.getElementById("accept-form");
  const acceptErrorEl = document.getElementById("accept-error");
  const acceptSubmitBtn = document.getElementById("accept-submit-btn");

  const token = new URLSearchParams(window.location.search).get("token");

  async function init() {
    invalidState.hidden = true;
    acceptForm.hidden = true;

    if (!token) {
      invalidMessage.textContent = "This page needs an invite link — ask your headteacher to send you one.";
      loadingState.hidden = true;
      invalidState.hidden = false;
      return;
    }

    try {
      const res = await fetch("/api/invite/teacher/lookup?token=" + encodeURIComponent(token));
      const data = await res.json().catch(() => ({}));

      if (!res.ok) {
        invalidMessage.textContent = data.error || "This invite link is invalid or has expired.";
        loadingState.hidden = true;
        invalidState.hidden = false;
        return;
      }

      document.getElementById("invited-email").textContent = data.email;
      loadingState.hidden = true;
      acceptForm.hidden = false;
      document.getElementById("display-name").focus();
    } catch {
      invalidMessage.textContent = "Could not reach the server. Try again.";
      loadingState.hidden = true;
      invalidState.hidden = false;
    }
  }

  acceptForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    acceptErrorEl.textContent = "";
    acceptSubmitBtn.disabled = true;

    const displayName = document.getElementById("display-name").value;

    try {
      const res = await fetch("/api/invite/teacher/accept", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, displayName })
      });

      if (res.ok) {
        window.location.href = "/";
        return;
      }

      const data = await res.json().catch(() => ({}));
      acceptErrorEl.textContent = data.error || "Could not create your account.";
    } catch {
      acceptErrorEl.textContent = "Could not reach the server. Try again.";
    } finally {
      acceptSubmitBtn.disabled = false;
    }
  });

  init();
</script>
</body>
</html>
