<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniShell &mdash; Teacher Dashboard</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e6e6;
    --muted: #8a8f98;
    --accent: #4fc3f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 64px;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0;
    font-size: 1.3rem;
  }
  .header-links {
    display: flex;
    gap: 8px;
  }
  .header-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
  }
  .header-links a:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    margin-bottom: 24px;
  }
  h2 {
    margin: 0 0 16px;
    font-size: 1.05rem;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    padding: 10px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #0f1115;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .error {
    color: #ff6b6b;
    font-size: 0.85rem;
    margin: -8px 0 16px;
    min-height: 1em;
  }
  .success {
    color: #6ee7a0;
    font-size: 0.85rem;
    margin: -8px 0 16px;
    min-height: 1em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .muted {
    color: var(--muted);
  }
  .empty {
    color: var(--muted);
    padding: 16px 0;
    text-align: center;
  }
  .reset-btn {
    padding: 6px 12px;
    font-size: 0.8rem;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .reset-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .delete-btn {
    padding: 6px 12px;
    font-size: 0.8rem;
    background: transparent;
    border: 1px solid var(--border);
    color: #ff6b6b;
  }
  .delete-btn:hover {
    background: #ff6b6b;
    color: #0f1115;
    border-color: #ff6b6b;
  }
  .delete-confirm {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: rgba(255, 107, 107, 0.08);
  }
  .delete-confirm.open {
    display: flex;
  }
  .delete-confirm p {
    margin: 0;
    font-size: 0.85rem;
    flex: 1;
  }
  .delete-confirm-btn {
    background: #ff6b6b;
    color: #0f1115;
  }
  .delete-cancel-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  #students-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .student-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .student-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .student-row:hover,
  .student-row.expanded {
    background: rgba(79, 195, 247, 0.08);
  }
  .student-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .student-name {
    font-weight: 600;
  }
  .student-username {
    color: var(--muted);
    font-size: 0.8rem;
  }
  .student-caret {
    color: var(--muted);
    font-size: 0.75rem;
  }
  .reset-form {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .reset-form.open {
    display: flex;
  }
  .reset-form input {
    margin-bottom: 0;
    flex: 1;
  }
  .reset-form .reset-error {
    color: #ff6b6b;
    font-size: 0.8rem;
    margin: 0;
  }
  .reset-form .reset-success {
    color: #6ee7a0;
    font-size: 0.8rem;
    margin: 0;
  }
  .attempts-panel {
    border-top: 1px solid var(--border);
    padding: 10px 14px 14px;
    background: rgba(0, 0, 0, 0.15);
  }
  .attempts-panel table {
    font-size: 0.85rem;
  }
  .attempts-panel .empty {
    padding: 4px 0;
    text-align: left;
  }
  .syllabus-section-heading {
    margin: 20px 0 8px;
    font-size: 0.9rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .syllabus-section-heading:first-child {
    margin-top: 0;
  }
  .syllabus-topics-group {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .topic-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .topic-toggle {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    color: var(--text);
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 14px;
    cursor: pointer;
  }
  .topic-toggle:hover {
    color: var(--accent);
  }
  .topic-detail {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .topic-detail.open {
    display: block;
  }
  .topic-detail p {
    margin: 0 0 12px;
    font-size: 0.88rem;
    color: var(--text);
    line-height: 1.5;
  }
  .topic-detail pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    overflow-x: auto;
    margin: 0;
  }
  .topic-detail code {
    font-family: "SF Mono", Consolas, monospace;
    font-size: 0.82rem;
  }
</style>
</head>
<body>

<main>
  <header>
    <h1>Teacher Dashboard</h1>
    <div class="header-links">
      <a href="/">Reference tool</a>
      <a href="/api/logout">Log out</a>
    </div>
  </header>

  <section class="card">
    <h2>Syllabus &mdash; teaching view</h2>
    <div id="syllabus-content">
      <p class="muted">Loading&hellip;</p>
    </div>
  </section>

  <section class="card">
    <h2>Add a student</h2>
    <form id="student-form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="off" required>

      <label for="password">Password</label>
      <input id="password" type="text" autocomplete="off" required>

      <label for="display-name">Student name</label>
      <input id="display-name" type="text" autocomplete="off">

      <p class="error" id="form-error"></p>
      <p class="success" id="form-success"></p>

      <button type="submit" id="submit-btn">Add student</button>
    </form>
  </section>

  <section class="card">
    <h2>Students</h2>
    <div id="roster-container">
      <p class="muted">Loading&hellip;</p>
    </div>
  </section>
</main>

<script>
  const SYLLABUS_LABELS = {
    aqa_gcse_cs: "AQA GCSE Computer Science (8525)",
    ocr_gcse_cs: "OCR GCSE Computer Science (J277)",
    edexcel_gcse_cs: "Edexcel/Pearson GCSE Computer Science (1CP2)"
  };

  function formatProviderLabel(id) {
    const key = id.replace(/^syllabus_/, "");
    return SYLLABUS_LABELS[key] || id;
  }

  // ---------- Computer Science syllabus (teaching view) ----------
  // Unlike the student-facing view, every topic starts expanded so a teacher
  // can scan the full syllabus at a glance when planning a lesson.

  async function loadSyllabus() {
    const container = document.getElementById("syllabus-content");
    try {
      const res = await fetch("/api/syllabus");
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.syllabus) {
        container.innerHTML = '<p class="muted">Your headteacher hasn\'t chosen an exam board yet.</p>';
        return;
      }
      const res2 = await fetch("data/syllabus_" + data.syllabus + ".json");
      if (!res2.ok) throw new Error("not found");
      const topics = await res2.json();
      renderSyllabus(container, topics);
    } catch {
      container.innerHTML = '<p class="error">Could not load the syllabus.</p>';
    }
  }

  function renderSyllabus(container, topics) {
    container.innerHTML = "";
    let lastSection = null;
    let currentList = null;

    topics.forEach((topic) => {
      if (topic.section !== lastSection) {
        lastSection = topic.section;
        const heading = document.createElement("p");
        heading.className = "syllabus-section-heading";
        heading.textContent = topic.section;
        container.appendChild(heading);

        currentList = document.createElement("ul");
        currentList.className = "syllabus-topics-group";
        container.appendChild(currentList);
      }

      const item = document.createElement("li");
      item.className = "topic-item";

      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "topic-toggle";
      toggle.textContent = topic.title;

      const detail = document.createElement("div");
      detail.className = "topic-detail open";

      const explanation = document.createElement("p");
      explanation.textContent = topic.explanation;
      detail.appendChild(explanation);

      if (topic.code) {
        const pre = document.createElement("pre");
        const codeEl = document.createElement("code");
        codeEl.textContent = topic.code;
        pre.appendChild(codeEl);
        detail.appendChild(pre);
      }

      toggle.addEventListener("click", () => {
        detail.classList.toggle("open");
      });

      item.appendChild(toggle);
      item.appendChild(detail);

      currentList.appendChild(item);
    });
  }

  async function checkRole() {
    try {
      const res = await fetch("/api/me");
      if (!res.ok) { window.location.href = "/"; return; }
      const data = await res.json();
      if (data.role !== "teacher") { window.location.href = "/"; }
    } catch {
      window.location.href = "/";
    }
  }

  async function loadProgress() {
    const rosterContainer = document.getElementById("roster-container");

    let rows;
    try {
      const res = await fetch("/api/teacher/progress");
      const data = await res.json();
      rows = data.rows || [];
    } catch {
      rosterContainer.innerHTML = '<p class="error">Could not load students.</p>';
      return;
    }

    renderRoster(rosterContainer, rows);
  }

  function renderRoster(container, rows) {
    const students = new Map();
    rows.forEach((row) => {
      if (!students.has(row.student_id)) {
        students.set(row.student_id, {
          id: row.student_id,
          name: row.display_name || row.username,
          username: row.username,
          attempts: []
        });
      }
      if (row.provider) {
        students.get(row.student_id).attempts.push(row);
      }
    });

    if (students.size === 0) {
      container.innerHTML = '<p class="empty">No students yet. Add one above.</p>';
      return;
    }

    const list = document.createElement("ul");
    list.id = "students-list";

    students.forEach((student) => {
      const item = document.createElement("li");
      item.className = "student-item";

      const row = document.createElement("div");
      row.className = "student-row";
      row.innerHTML = `
        <div class="student-info">
          <span class="student-name"></span>
          <span class="student-username"></span>
        </div>
        <span class="student-caret">▸</span>
      `;
      row.querySelector(".student-name").textContent = student.name;
      row.querySelector(".student-username").textContent = student.username;

      const resetBtn = document.createElement("button");
      resetBtn.type = "button";
      resetBtn.className = "reset-btn";
      resetBtn.textContent = "Reset password";
      row.insertBefore(resetBtn, row.querySelector(".student-caret"));

      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "delete-btn";
      deleteBtn.textContent = "Delete";
      row.insertBefore(deleteBtn, row.querySelector(".student-caret"));

      const deleteConfirm = document.createElement("div");
      deleteConfirm.className = "delete-confirm";
      deleteConfirm.innerHTML = `
        <p>Delete <strong>${student.name}</strong>? This permanently removes their account and quiz history.</p>
        <button type="button" class="delete-cancel-btn">Cancel</button>
        <button type="button" class="delete-confirm-btn">Delete</button>
      `;

      const resetForm = document.createElement("div");
      resetForm.className = "reset-form";
      resetForm.innerHTML = `
        <input type="text" placeholder="New password" class="reset-password-input" autocomplete="off">
        <button type="button" class="reset-confirm-btn">Confirm</button>
        <p class="reset-error"></p>
        <p class="reset-success"></p>
      `;

      const attemptsPanel = document.createElement("div");
      attemptsPanel.className = "attempts-panel";
      attemptsPanel.hidden = true;

      if (student.attempts.length === 0) {
        attemptsPanel.innerHTML = '<p class="empty">No quiz attempts yet.</p>';
      } else {
        const table = document.createElement("table");
        table.innerHTML = `
          <thead><tr><th>Language</th><th>Score</th><th>Date</th></tr></thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector("tbody");
        student.attempts.forEach((attempt) => {
          const tr = document.createElement("tr");
          const date = new Date(attempt.completed_at).toLocaleDateString();
          tr.innerHTML = `<td>${formatProviderLabel(attempt.provider)}</td><td>${attempt.score} / ${attempt.total}</td><td>${date}</td>`;
          tbody.appendChild(tr);
        });
        attemptsPanel.appendChild(table);
      }

      const caret = row.querySelector(".student-caret");
      row.addEventListener("click", () => {
        attemptsPanel.hidden = !attemptsPanel.hidden;
        row.classList.toggle("expanded", !attemptsPanel.hidden);
        caret.textContent = attemptsPanel.hidden ? "▸" : "▾";
      });

      resetBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        resetForm.classList.toggle("open");
      });

      const confirmBtn = resetForm.querySelector(".reset-confirm-btn");
      const passwordInput = resetForm.querySelector(".reset-password-input");
      const resetErrorEl = resetForm.querySelector(".reset-error");
      const resetSuccessEl = resetForm.querySelector(".reset-success");

      resetForm.addEventListener("click", (e) => e.stopPropagation());

      confirmBtn.addEventListener("click", async () => {
        resetErrorEl.textContent = "";
        resetSuccessEl.textContent = "";
        const newPassword = passwordInput.value;
        if (!newPassword) {
          resetErrorEl.textContent = "Enter a new password.";
          return;
        }
        confirmBtn.disabled = true;
        try {
          const res = await fetch("/api/teacher/students/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studentId: student.id, newPassword })
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            resetSuccessEl.textContent = "Password updated.";
            passwordInput.value = "";
          } else {
            resetErrorEl.textContent = data.error || "Could not reset password.";
          }
        } catch {
          resetErrorEl.textContent = "Could not reach the server.";
        } finally {
          confirmBtn.disabled = false;
        }
      });

      deleteBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteConfirm.classList.toggle("open");
      });

      deleteConfirm.addEventListener("click", (e) => e.stopPropagation());

      deleteConfirm.querySelector(".delete-cancel-btn").addEventListener("click", () => {
        deleteConfirm.classList.remove("open");
      });

      deleteConfirm.querySelector(".delete-confirm-btn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        try {
          const res = await fetch("/api/teacher/students/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ studentId: student.id })
          });
          if (res.ok) {
            item.remove();
            if (document.querySelectorAll(".student-item").length === 0) {
              container.innerHTML = '<p class="empty">No students yet. Add one above.</p>';
            }
          } else {
            btn.disabled = false;
          }
        } catch {
          btn.disabled = false;
        }
      });

      item.appendChild(row);
      item.appendChild(resetForm);
      item.appendChild(deleteConfirm);
      item.appendChild(attemptsPanel);
      list.appendChild(item);
    });

    container.innerHTML = "";
    container.appendChild(list);
  }

  const form = document.getElementById("student-form");
  const errorEl = document.getElementById("form-error");
  const successEl = document.getElementById("form-success");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.textContent = "";
    successEl.textContent = "";
    submitBtn.disabled = true;

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const displayName = document.getElementById("display-name").value;

    try {
      const res = await fetch("/api/teacher/students", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password, displayName })
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        successEl.textContent = `Added student "${data.username}".`;
        form.reset();
        loadProgress();
      } else {
        errorEl.textContent = data.error || "Could not add student.";
      }
    } catch {
      errorEl.textContent = "Could not reach the server. Try again.";
    } finally {
      submitBtn.disabled = false;
    }
  });

  checkRole();
  loadProgress();
  loadSyllabus();
</script>
</body>
</html>
