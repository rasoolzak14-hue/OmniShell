<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniShell</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-links">
    <a id="role-link" hidden></a>
    <a id="logout-link" href="/api/logout">Log out</a>
  </div>
  <h1>OmniShell</h1>
  <p class="subtitle">Search commands for Linux, PowerShell, Python, and more</p>
</header>

<main>
  <section id="provider-select">
    <h2 class="group-heading">Syllabus</h2>
    <p id="syllabus-empty" class="muted small-note">Your school hasn't chosen an exam board yet.</p>

    <h2 class="group-heading" id="extra-heading">Extra learning material</h2>
    <button class="provider-card" data-provider="linux" data-file="linux_commands.json">
      <span class="provider-name">Linux</span>
      <span class="provider-hint">bash / shell commands</span>
    </button>
    <button class="provider-card" data-provider="powershell" data-file="powershell_commands.json">
      <span class="provider-name">PowerShell</span>
      <span class="provider-hint">Windows PowerShell cmdlets</span>
    </button>
    <button class="provider-card" data-provider="python" data-file="python_commands.json">
      <span class="provider-name">Python</span>
      <span class="provider-hint">basic Python syntax</span>
    </button>
    <button class="provider-card" data-provider="javascript" data-file="javascript_commands.json">
      <span class="provider-name">JavaScript</span>
      <span class="provider-hint">basic JavaScript syntax</span>
    </button>
    <button class="provider-card" data-provider="java" data-file="java_commands.json">
      <span class="provider-name">Java</span>
      <span class="provider-hint">basic Java syntax</span>
    </button>
    <button class="provider-card" data-provider="cpp" data-file="cpp_commands.json">
      <span class="provider-name">C++</span>
      <span class="provider-hint">basic C++ syntax</span>
    </button>
    <button class="provider-card" data-provider="sql" data-file="sql_commands.json">
      <span class="provider-name">SQL</span>
      <span class="provider-hint">basic database queries</span>
    </button>
    <button class="provider-card" data-provider="git" data-file="git_commands.json">
      <span class="provider-name">Git</span>
      <span class="provider-hint">version control commands</span>
    </button>
  </section>

  <section id="provider-view" hidden>
    <div class="toolbar">
      <button id="back-btn">&larr; Back</button>
      <h2 id="provider-title"></h2>
    </div>

    <label for="search-input" class="sr-only">Search by keyword</label>
    <input id="search-input" type="text" placeholder="Search by keyword (e.g. &quot;move directory&quot;)...">

    <p id="result-count"></p>
    <ol id="command-list"></ol>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
